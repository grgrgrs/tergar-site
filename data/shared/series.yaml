# Shared meeting series (Tergar coordinator role: George maintains these).
# Groups list them by id; groups can't change these records.
# Seeded from the Venice (Oct 30, 2026) and Stuart (Nov 1, 2026) newsletters.
#
# cadence: weekly | every_other_week (needs anchor_date) | monthly_weeks (needs weeks)
# format: in_person | zoom | both
# zoom_access: on_request (default) | shown (needs zoom_url; published on the page)
# Zoom links are not stored here while access is "on_request".
# has_prerequisites: true -> "Has prerequisites" pill; subscription: JOL or VOL -> pill.
# (requires: text is kept for reference and not shown on the page.)

series:
  - id: nectar-wednesday
    title: Nectar of the Path practice
    host: Tergar Portland
    cadence: weekly
    weekday: Wednesday
    start_time: "12:30"
    time_zone: America/New_York
    format: zoom
    place: Online (Zoom)
    zoom_access: on_request
    requires: null
    description: >-
      The Nectar of the Path is a short practice text composed by Mingyur
      Rinpoche during a retreat in 2010. It includes chanting, contemplation,
      visualization and meditation, leading through the Four Thoughts, Refuge,
      Bodhichitta and Guru Yoga.
    notes: All are welcome. New to the practice? Start with the introductory talk by Tim Olmsted.
    links:
      - title: Introductory talk by Tim Olmsted
        url: https://www.youtube.com/watch?v=UzPE0X2CAGY

