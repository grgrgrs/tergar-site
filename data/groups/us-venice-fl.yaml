contact:
  consent: true

first_announcement: null

quote: ma-jaya-quiet-mind

next_meeting:
  date: 2026-11-09
  title: The Challenge Zone
  description: Returning to the wisdom and wit of beloved Pema Chodron, we will be introduced to the
    myriad methods of reaching enlightenment based on the Vajrayana view that we are already fully
    whole if only we could recognize that reality. These tips for preparing for our own deaths are
    sure to spark probing questions and deep discussion.
  reading: >-
    How We Live Is How We Die,  Chapter 18, “Opening to the Sacred World,” pp. 109 to 116.
  
    It’s helpful to have books with you along with any questions or comments you may have. As
    always, context is provided so all will be able to participate in discussions so feel welcome to
    join us.
  
  
    Bring your book if you can, but context is given so that all may participate in meaningful
    discussion.
  
  
    All are welcome to participate.
  contemplation: Are you able to acknowledge the parameters of your own comfort zone with the intent
    of pushing gently beyond them to sit with something you find challenging?

