path: us/venice-fl
name: Tergar Venice
full_name: Venice Tergar Meditation Group
location: Venice, Florida
time_zone: America/New_York
about: >-
  Tergar Meditation Groups are based on The Joy of Living teachings of
  Buddhist teacher Yongey Mingyur Rinpoche. Each weekly gathering includes
  20 minutes of guided meditation followed by a book discussion or deepening
  meditation sessions. We invite both experienced and new meditators, from
  any or no spiritual tradition. Our group is hosted by the Blue Lotus
  Community House.

# Role address only, and published only once the group has consented.
# The address itself is kept in data/private/contacts.yaml (not in git).
contact:
  consent: true

first_announcement: null

quote: ma-jaya-quiet-mind

next_meeting:
  date: 2026-11-06
  title: Meditating on Sound
  description: Sounds can have a naturally soothing quality on the mind. When experienced with
    meditative awareness, even those that we ordinarily consider abrasive can elicit a sense of deep
    stillness and contentment. To use sounds as supports for meditation, all you have to do is
    listen with awareness. In other words, as you listen, know that you are listening. We will
    practice listening to sound as support for meditation.
  reading: >-
    The Joy of Living, pages. 151 to 154, Meditating on Sound.
  
  
    Bring your book if you can, but context is given so that all may participate in meaningful
    discussion.
  
  
    All are welcome to participate.
  contemplation: What is the difference between hearing a sound and meditating on sound?

